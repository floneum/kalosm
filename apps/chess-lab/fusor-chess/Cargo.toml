[package]
name = "rookie-fusor"
version = "0.1.0"
edition = "2024"
[workspace]
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
fusor = { path = "../../../fusor/fusor", default-features = false, features = ["gpu", "cpu"] }
bytemuck = "1"
serde_json = "1"
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
[patch.crates-io]
wgpu = { git = "https://github.com/ealmloff/wgpu", rev = "24a7d3577213fc147637fe7fb20e0e845a74df8a" }
naga = { git = "https://github.com/ealmloff/wgpu", rev = "24a7d3577213fc147637fe7fb20e0e845a74df8a" }
[profile.release]
lto = "thin"
strip = "debuginfo"
