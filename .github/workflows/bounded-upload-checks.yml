name: Bounded initialization staging validation
on:
  push:
    branches: [codex/bounded-upload-checks]
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 1
  CARGO_INCREMENTAL: 0
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 9f52cde755f06575510c7a62e872d89bb0a96c81
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fusor -> target
          shared-key: upload-reclaim-host
      - run: cargo test --locked --manifest-path fusor/Cargo.toml -p fusor --no-default-features --features cpu --lib -- --test-threads=1
      - run: cargo clippy --locked --manifest-path fusor/Cargo.toml -p fusor --no-default-features --features cpu --lib -- -D warnings
  gpu:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      FUSOR_CONFORMANCE_REQUIRE_GPU: '1'
      FUSOR_COMPILE_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 9f52cde755f06575510c7a62e872d89bb0a96c81
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fusor/target
          key: immutable-upload-green-${{ runner.os }}-${{ hashFiles('fusor/Cargo.lock') }}
          restore-keys: |
            bounded-upload-red-${{ runner.os }}-
            immutable-upload-green-${{ runner.os }}-
            immutable-upload-red-${{ runner.os }}-
      - name: Check immutable storage, rebinding, preparation, and compiler conformance
        run: |
          cargo fmt --manifest-path fusor/Cargo.toml --all -- --check
          cargo test --locked --manifest-path fusor/Cargo.toml -p fusor-gpu --features compiler-tests --lib -- --test-threads=1
          cargo test --locked --manifest-path fusor/Cargo.toml -p fusor --no-default-features --features gpu,kernel-observer,compiler-tests --lib -- --test-threads=1
          cargo test --locked --manifest-path fusor/Cargo.toml -p fusor --no-default-features --features gpu,kernel-observer,compiler-tests --test shared_compiler -- --ignored --test-threads=1
          cargo clippy --locked --manifest-path fusor/Cargo.toml --workspace --all-targets --features fusor/kernel-observer,fusor/compiler-tests -- -D warnings
  red:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c98b8b52cb2e999a4f500d006d9eed96eaa1dd87
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fusor/target
          key: bounded-upload-red-${{ runner.os }}-${{ hashFiles('fusor/Cargo.lock') }}
          restore-keys: |
            grouped-load-projection-${{ runner.os }}-
            immutable-upload-green-${{ runner.os }}-
      - name: Prove pending staging retains the second allocation set
        shell: bash
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          p = Path('fusor/fusor-gpu/src/pool.rs')
          s = p.read_text().replace('        let before = pool.device.get_internal_counters().hal.buffers.read();', '        pool.queue.submit([]);\n        pool.device.poll(wgpu::PollType::wait_indefinitely()).unwrap();\n        let before = pool.device.get_internal_counters().hal.buffers.read();')
          p.write_text(s)
          PYTEST
          git diff
          set +e
          cargo test --locked --manifest-path fusor/Cargo.toml -p fusor-gpu --features compiler-tests --lib initial_uploads_do_not_retain_a_second_full_device_copy -- --test-threads=1 > red.log 2>&1
          code=$?
          set -e
          cat red.log
          test "$code" = 101
          grep -F 'initial upload staging grows with the complete tensor set' red.log
  release:
    needs: [cpu, gpu, red]
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/model-release-target
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 9f52cde755f06575510c7a62e872d89bb0a96c81
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            model-release-target
          key: immutable-upload-model-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            immutable-upload-model-${{ runner.os }}-
            upload-reclaim-model-${{ runner.os }}-
            workgroup-model-${{ runner.os }}-
      - name: Build default release
        shell: bash
        run: |
          set -euo pipefail
          mkdir artifacts
          {
            rustc -Vv
            git rev-parse HEAD
            shasum -a 256 models/kalosm-llama/examples/profile_forward.rs models/kalosm-llama/src/model/inference.rs
            echo 'cargo build --locked -j 1 -p kalosm-llama --example profile_forward --release --target aarch64-apple-darwin'
          } > artifacts/provenance.txt
          cargo build --locked -j 1 -p kalosm-llama --example profile_forward --release --target aarch64-apple-darwin
          cp "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/examples/profile_forward" artifacts/profile-forward-storage
          shasum -a 256 artifacts/profile-forward-storage >> artifacts/provenance.txt
          echo 'cargo build --locked -j 1 -p kalosm --example chat --features llama --release --target aarch64-apple-darwin' >> artifacts/provenance.txt
          shasum -a 256 interfaces/kalosm/examples/chat.rs >> artifacts/provenance.txt
          cargo build --locked -j 1 -p kalosm --example chat --features llama --release --target aarch64-apple-darwin
          cp "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/examples/chat" artifacts/chat-storage
          shasum -a 256 artifacts/chat-storage >> artifacts/provenance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bounded-upload-default-release
          path: artifacts
          retention-days: 7
