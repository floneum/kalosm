name: Fusor proofs

on:
  push:
    branches: [main]
    paths:
      - 'fusor/fusor-ir/proofs/**'
      - '.github/workflows/fusor-proofs.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'fusor/fusor-ir/proofs/**'
      - '.github/workflows/fusor-proofs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Lean proof (4.24.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned elan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/elan"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/elan.tar.gz" \
            https://github.com/leanprover/elan/releases/download/v4.4.0/elan-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path \
            --default-toolchain leanprover/lean4:v4.24.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check theorem and print axiom audit
        working-directory: fusor/fusor-ir/proofs
        run: lean -DwarningAsError=true MapFusion.lean
