name: Rust CI

on:
  push:
    branches:
      - main
    paths:
      - interfaces/*/src/**
      - interfaces/*/examples/**
      - interfaces/*/Cargo.toml
      - models/*/src/**
      - models/*/examples/**
      - models/*/Cargo.toml
      - floneum/*/src/**
      - floneum/*/examples/**
      - floneum/*/Cargo.toml
      - fusor/**
      - src/**
      - .github/**
      - Cargo.toml
      - Cargo.lock

  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - interfaces/*/src/**
      - interfaces/*/examples/**
      - interfaces/*/Cargo.toml
      - models/*/src/**
      - models/*/examples/**
      - models/*/Cargo.toml
      - floneum/*/src/**
      - floneum/*/examples/**
      - floneum/*/Cargo.toml
      - fusor/**
      - src/**
      - .github/**
      - Cargo.toml
      - Cargo.lock

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Shape: one `build` job per platform compiles everything once — it is the
# only job that saves the `linux-build` cache slot, and it archives every
# test binary with `cargo nextest archive`. Every other job on the platform
# `needs` it and either restores that slot (doc: it links the same .rlibs)
# or just downloads an artifact (tests, conformance shards: no toolchain, no
# compile). Clippy runs check-mode, whose artifacts are different, so it
# keeps its own slot.
#
# `CARGO_INCREMENTAL=0` keeps the cache lean — `Swatinem/rust-cache` wipes
# incremental artifacts before saving. One feature set for every build job:
# each distinct set is a separate full compile and a separate cache slot.
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FEATURES: kalosm/language,kalosm/llama,kalosm/bert,kalosm/structured,kalosm/fs-documents,kalosm/sound,kalosm/sound-denoise,kalosm/sound-source,kalosm/sound-voice-detection,kalosm/vision,kalosm/remote,kalosm/scrape,kalosm/surrealdb-local

jobs:
  build:
    if: github.event.pull_request.draft == false
    name: Build
    runs-on: ubuntu-24.04
    steps:
      # Checkout MUST come before `Swatinem/rust-cache` so the cache key
      # hashes the real lock files.
      - uses: actions/checkout@v6
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune -af || true
          df -h
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libayatana-appindicator3-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          # Codegen-mode slot. Saved from PRs too, keyed on the lock files: a
          # PR whose lock differs from main never restored anything before,
          # and every job compiled ~800 crates cold. Both workspaces: the
          # fusor workspace has its own target dir, and an unlisted
          # workspace is never cached.
          shared-key: "linux-build"
          workspaces: |
            . -> target
            fusor -> target
          cache-on-failure: "true"
      - name: Build test archives and the conformance binary
        run: |
          # The whole workspace, so feature unification matches the doc job's
          # and it reuses every rlib from this cache; the two model crates
          # whose tests need downloads are skipped when the archive runs.
          cargo nextest archive --cargo-profile ci --workspace --lib --bins --tests --examples \
            --features $FEATURES --archive-file root-tests.tar.zst
          cargo nextest archive --cargo-profile ci --manifest-path fusor/Cargo.toml --workspace \
            --lib --bins --tests --examples --archive-file fusor-tests.tar.zst
          cargo build --profile ci --manifest-path fusor/Cargo.toml -p fusor-conformance
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tests
          path: |
            root-tests.tar.zst
            fusor-tests.tar.zst
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: fusor-conformance-linux
          path: fusor/target/ci/fusor-conformance
          retention-days: 1

  test:
    needs: build
    name: Test Suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libayatana-appindicator3-dev libxdo-dev mesa-vulkan-drivers vulkan-tools
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: actions/download-artifact@v4
        with:
          name: linux-tests
      - name: Configure lavapipe
        uses: ./.github/actions/lavapipe
      - name: Run tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FUSOR_CONFORMANCE_REQUIRE_GPU: "1"
        run: |
          cargo nextest run --archive-file root-tests.tar.zst --workspace-remap . --extract-to . \
            -E 'not (package(rbert) | package(rwhisper))'
          cargo nextest run --archive-file fusor-tests.tar.zst --workspace-remap fusor --extract-to fusor

  # Shards balanced from measured per-suite times. A filter ending in `::`
  # matches one suite exactly (the harness matches by substring), and
  # `--shard=I/N` splits one suite's cases round-robin over N runners.
  conformance:
    needs: build
    name: Conformance (${{ matrix.shard.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { name: core, suites: "smoke:: elementwise:: reductions:: multi_slot:: views:: indexing_scatter:: dtypes::", args: "" }
          - { name: matmul, suites: "matmul:: conv_pool::", args: "" }
          - { name: norm-layers, suites: "normalization:: layers::", args: "" }
          - { name: attention-backward, suites: "attention_rope:: backward::", args: "" }
          - { name: quantized, suites: "quantized::", args: "" }
          - { name: sampling-0, suites: "sampling::", args: "--shard=0/3" }
          - { name: sampling-1, suites: "sampling::", args: "--shard=1/3" }
          - { name: sampling-2, suites: "sampling::", args: "--shard=2/3" }
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github
      - name: Install lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools
      - name: Configure lavapipe
        uses: ./.github/actions/lavapipe
      - uses: actions/download-artifact@v4
        with:
          name: fusor-conformance-linux
          path: bin
      - name: Run conformance shard
        env:
          FUSOR_CONFORMANCE_REQUIRE_GPU: "1"
        run: |
          chmod +x bin/fusor-conformance
          for suite in ${{ matrix.shard.suites }}; do
            bin/fusor-conformance "$suite" ${{ matrix.shard.args }}
          done

  doc:
    needs: build
    name: Docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune -af || true
          df -h
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libayatana-appindicator3-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The slot `build` just saved, same profile and feature set:
          # doctests link those .rlibs, so only the doctests compile here.
          shared-key: "linux-build"
          workspaces: |
            . -> target
            fusor -> target
          save-if: "false"
      - run: |
          cargo test --profile ci --doc --workspace --features $FEATURES
          cargo test --profile ci --manifest-path fusor/Cargo.toml --doc --workspace

  # Clippy is `cargo check` plus lints over the same targets, so there is no
  # separate check job.
  clippy:
    if: github.event.pull_request.draft == false
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libayatana-appindicator3-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Check-mode slot (metadata only), apart from the codegen slot: a
          # metadata-only cache holds none of the .rlibs the build needs.
          shared-key: "linux-check"
          workspaces: |
            . -> target
            fusor -> target
          cache-on-failure: "true"
      - run: |
          cargo clippy --workspace --examples --tests --features $FEATURES -- -D warnings
          cargo clippy --manifest-path fusor/Cargo.toml --workspace --all-targets -- -D warnings

  fmt:
    if: github.event.pull_request.draft == false
    name: Rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path fusor/Cargo.toml --all -- --check
