name: Grouped storage load compiler checks
on:
  push:
    branches: [codex/grouped-load-checks, codex/grouped-load-green]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      FUSOR_CONFORMANCE_REQUIRE_GPU: '1'
      FUSOR_COMPILE_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: b97cbaf8afa21c8eac5ed7d4968bf9af10505389
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fusor/target
          key: grouped-load-${{ runner.os }}-${{ hashFiles('fusor/Cargo.lock') }}
          restore-keys: |
            attention-partition-${{ runner.os }}-
            immutable-upload-green-${{ runner.os }}-
      - name: Verify complete-group emission and exact output preservation
        run: cargo test --locked --manifest-path fusor/Cargo.toml -p fusor-gpu --lib emit::vector_loads_tests -- --test-threads=1
      - name: Shared compiler correctness and lint
        run: |
          cargo fmt --manifest-path fusor/Cargo.toml --all -- --check
          cargo test --locked --manifest-path fusor/Cargo.toml -p fusor-gpu --lib -- --test-threads=1
          cargo test --locked --manifest-path fusor/Cargo.toml -p fusor --no-default-features --features gpu,kernel-observer,compiler-tests --test shared_compiler -- --ignored --test-threads=1
          cargo clippy --locked --manifest-path fusor/Cargo.toml --workspace --all-targets --features fusor/kernel-observer,fusor/compiler-tests -- -D warnings
      - name: Build matched projection fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir artifacts
          rustc -Vv > artifacts/provenance.txt
          for arm in candidate baseline; do
            if [ "$arm" = baseline ]; then
              git fetch --depth=1 origin b87dd97364b52aa9ad114cd3e9537ba4503155e9
              git checkout --detach b87dd97364b52aa9ad114cd3e9537ba4503155e9
            fi
            echo "$arm" >> artifacts/provenance.txt
            git rev-parse HEAD >> artifacts/provenance.txt
            cargo build --locked --manifest-path fusor/Cargo.toml -p fusor --no-default-features --features gpu,kernel-observer --example qmatmul_lab
            cp fusor/target/debug/examples/qmatmul_lab "artifacts/qmatmul-$arm"
            shasum -a 256 "artifacts/qmatmul-$arm" >> artifacts/provenance.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: grouped-load-fixtures
          path: artifacts
          retention-days: 7
  release:
    needs: [red, check]
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/model-release-target
    steps:
      - uses: actions/checkout@v6
        with:
          ref: b97cbaf8afa21c8eac5ed7d4968bf9af10505389
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            model-release-target
          key: grouped-load-model-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            immutable-upload-model-${{ runner.os }}-
      - name: Build ordinary default decode profiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir artifacts
          {
            rustc -Vv
            git rev-parse HEAD
            shasum -a 256 models/kalosm-llama/examples/profile_forward.rs models/kalosm-llama/src/model/inference.rs
          } > artifacts/provenance.txt
          cargo build --locked -j 1 -p kalosm-llama --example profile_forward --release --target aarch64-apple-darwin
          cp "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/examples/profile_forward" artifacts/profile-forward-vector
          shasum -a 256 artifacts/profile-forward-vector >> artifacts/provenance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: grouped-load-default-release
          path: artifacts
          retention-days: 7
  red:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: b87dd97364b52aa9ad114cd3e9537ba4503155e9
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fusor/target
          key: grouped-load-red-${{ runner.os }}-${{ hashFiles('fusor/Cargo.lock') }}
          restore-keys: |
            attention-partition-${{ runner.os }}-
            immutable-upload-green-${{ runner.os }}-
      - name: Require the old emitter to fail the regression
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin b97cbaf8afa21c8eac5ed7d4968bf9af10505389
          git show b97cbaf8afa21c8eac5ed7d4968bf9af10505389:fusor/fusor-gpu/src/emit/vector_loads_tests.rs > fusor/fusor-gpu/src/emit/vector_loads_tests.rs
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('fusor/fusor-gpu/src/emit.rs')
          p.write_text(p.read_text() + '\n#[cfg(test)]\nmod vector_loads_tests;\n')
          PYCODE
          set +e
          cargo test --locked --manifest-path fusor/Cargo.toml -p fusor-gpu --lib complete_aligned_scalar_reads_use_one_vector_storage_element -- --exact emit::vector_loads_tests::complete_aligned_scalar_reads_use_one_vector_storage_element > red.log 2>&1
          code=$?
          set -e
          cat red.log
          test "$code" = 101
          grep -F 'four adjacent reads still use scalar storage' red.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grouped-load-red-log
          path: red.log
          retention-days: 7
