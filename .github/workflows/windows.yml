name: windows

on:
  push:
    branches:
      - main
    paths:
      - interfaces/*/src/**
      - interfaces/*/examples/**
      - interfaces/*/Cargo.toml
      - models/*/src/**
      - models/*/examples/**
      - models/*/Cargo.toml
      - floneum/*/src/**
      - floneum/*/examples/**
      - floneum/*/Cargo.toml
      - fusor/**
      - src/**
      - .github/**
      - Cargo.toml
      - Cargo.lock

  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - interfaces/*/src/**
      - interfaces/*/examples/**
      - interfaces/*/Cargo.toml
      - models/*/src/**
      - models/*/examples/**
      - models/*/Cargo.toml
      - floneum/*/src/**
      - floneum/*/examples/**
      - floneum/*/Cargo.toml
      - fusor/**
      - src/**
      - .github/**
      - Cargo.toml
      - Cargo.lock
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Shape: `build` compiles everything once and is the only saver of the
# `windows-stable` cache slot; the test run and the five conformance shards
# `need` it and only download what it archived. Whole, the conformance
# sweep was 21 minutes on WARP and each job compiled the workspace again.
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FEATURES: kalosm/language,kalosm/sound,kalosm/vision,kalosm/remote,kalosm/scrape

jobs:
  build:
    if: github.event.pull_request.draft == false
    runs-on: windows-2022
    name: windows (build)
    steps:
      - name: disable git eol translation
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      # `dtolnay/rust-toolchain` is a single-step toolchain install that
      # uses the GitHub Actions toolchain cache; much faster than the
      # `Invoke-WebRequest win.rustup.rs` dance.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          # Distinct from the Linux cache so we don't ever try to restore
          # x86_64-unknown-linux-gnu artefacts onto x86_64-pc-windows-msvc.
          # Both workspaces build into the root target dir (`--target-dir`).
          shared-key: "windows-stable"
          workspaces: |
            . -> target
            fusor -> ../target
          cache-on-failure: "true"
      - name: Build test archives and the conformance binary
        shell: bash
        run: |
          rustc -Vv
          cargo -V
          cargo nextest archive --cargo-profile ci --all --lib --bins --tests \
            --features $FEATURES --exclude kalosm-parse-macro --exclude rbert --exclude rwhisper \
            --archive-file root-tests.tar.zst
          cargo nextest archive --cargo-profile ci --manifest-path fusor/Cargo.toml --target-dir target \
            --workspace --lib --bins --tests --examples --archive-file fusor-tests.tar.zst
          cargo build --profile ci --manifest-path fusor/Cargo.toml --target-dir target -p fusor-conformance
      - uses: actions/upload-artifact@v4
        with:
          name: windows-tests
          path: |
            root-tests.tar.zst
            fusor-tests.tar.zst
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: fusor-conformance-windows
          path: target/ci/fusor-conformance.exe
          retention-days: 1

  tests:
    needs: build
    runs-on: windows-2022
    name: windows (tests)
    steps:
      - name: disable git eol translation
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - name: WARP and DXC
        uses: ./.github/actions/warp-dxc
      - uses: actions/download-artifact@v4
        with:
          name: windows-tests
      - name: Run tests
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FUSOR_CONFORMANCE_REQUIRE_GPU: "1"
          WGPU_DX12_COMPILER: Dxc
        run: |
          # The WARP and DXC DLLs must sit next to every test binary that
          # opens the adapter. Both archives extract under ./target/ci.
          mkdir -p target/ci/deps
          cp warp/d3d10warp.dll dxc/dxcompiler.dll dxc/dxil.dll target/ci/deps/
          # WARP/DX12 tests share one software adapter inside each binary;
          # keep them serialized to avoid backend aborts.
          cargo nextest run --archive-file root-tests.tar.zst --workspace-remap . --extract-to . --test-threads 1
          cargo nextest run --archive-file fusor-tests.tar.zst --workspace-remap fusor --extract-to . --test-threads 1

  conformance:
    needs: build
    runs-on: windows-2022
    name: windows (${{ matrix.shard.name }})
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { name: core, suites: "smoke:: elementwise:: reductions:: multi_slot:: views:: indexing_scatter:: dtypes::" }
          - { name: matmul, suites: "matmul:: conv_pool::" }
          - { name: layers, suites: "normalization:: attention_rope:: layers:: backward::" }
          - { name: quantized, suites: "quantized::" }
          - { name: sampling, suites: "sampling::" }
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github
      - name: WARP and DXC
        uses: ./.github/actions/warp-dxc
      - uses: actions/download-artifact@v4
        with:
          name: fusor-conformance-windows
          path: bin
      - name: Run conformance shard
        shell: bash
        env:
          FUSOR_CONFORMANCE_REQUIRE_GPU: "1"
          WGPU_DX12_COMPILER: Dxc
        run: |
          cp warp/d3d10warp.dll dxc/dxcompiler.dll dxc/dxil.dll bin/
          for suite in ${{ matrix.shard.suites }}; do
            bin/fusor-conformance.exe "$suite"
          done
