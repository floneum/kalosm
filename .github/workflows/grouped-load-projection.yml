name: Projection storage grouping diagnosis
on:
  push:
    branches: [codex/grouped-load-projection]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      FUSOR_AUTOTUNE_MIN_MACS: '18446744073709551615'
      FUSOR_PIN_CONTRACT_FAMILY: sgemv
      FUSOR_PIN_SGEMV: '32,2,4,4,32'
      FUSOR_COMPILE_THREADS: '1'
      FUSOR_DEBUG_VECTOR_LOADS: '1'
      LAB_ASSERT_VECTOR_STORAGE: '1'
      LAB_QLAYOUT: native
    steps:
      - uses: actions/checkout@v6
        with:
          ref: bd4ee4def5221b594a98d4ab6cfdce571c7b9c28
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fusor/target
          key: grouped-load-projection-${{ runner.os }}-${{ hashFiles('fusor/Cargo.lock') }}
          restore-keys: |
            grouped-load-${{ runner.os }}-
            attention-shapes-${{ runner.os }}-
            attention-partition-${{ runner.os }}-
      - name: Exercise actual projection address expressions
        run: cargo run --locked --manifest-path fusor/Cargo.toml -p fusor --no-default-features --features gpu,kernel-observer --example qmatmul_lab -- 1 4096 4096 q4k 3
