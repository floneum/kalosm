name: Complete storage pair compiler checks
on:
  push:
    branches: [codex/grouped-pair-projection]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      FUSOR_AUTOTUNE_MIN_MACS: '18446744073709551615'
      FUSOR_COMPILE_THREADS: '1'
      LAB_QLAYOUT: native
      LAB_VALIDATE_ONLY: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 38e8ae830d1650add65411e93b7b64f7ef0dc17f
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fusor/target
          key: grouped-load-projection-${{ runner.os }}-${{ hashFiles('fusor/Cargo.lock') }}
          restore-keys: |
            grouped-load-${{ runner.os }}-
            attention-shapes-${{ runner.os }}-
            attention-partition-${{ runner.os }}-
      - name: Exercise actual projection address expressions
        run: FUSOR_PIN_CONTRACT_FAMILY=sgemv FUSOR_PIN_SGEMV=32,2,4,4,32 LAB_ASSERT_VECTOR_STORAGE=1 cargo run --locked --manifest-path fusor/Cargo.toml -p fusor --no-default-features --features gpu,kernel-observer --example qmatmul_lab -- 1 4096 4096 q4k 3
      - name: Storage regression tests
        run: cargo test --locked --manifest-path fusor/Cargo.toml -p fusor-gpu --lib emit::vector_loads_tests -- --test-threads=1
      - name: Shared GPU correctness and lint
        run: |
          cargo test --locked --manifest-path fusor/Cargo.toml -p fusor --no-default-features --features gpu,kernel-observer,compiler-tests --test shared_compiler -- --ignored --test-threads=1
          cargo clippy --locked --manifest-path fusor/Cargo.toml --workspace --all-targets --features fusor/kernel-observer,fusor/compiler-tests -- -D warnings
      - name: Build current projection fixture
        shell: bash
        run: |
          mkdir artifacts
          rustc -Vv > artifacts/provenance.txt
          git rev-parse HEAD >> artifacts/provenance.txt
          cargo build --locked --manifest-path fusor/Cargo.toml -p fusor --no-default-features --features gpu,kernel-observer --example qmatmul_lab
          cp fusor/target/debug/examples/qmatmul_lab artifacts/qmatmul-candidate
          shasum -a 256 artifacts/qmatmul-candidate >> artifacts/provenance.txt
          git fetch --depth=1 origin 8a64c7c1699eff0b8d196a9441b81376af69bc9e
          git checkout --detach 8a64c7c1699eff0b8d196a9441b81376af69bc9e
          git rev-parse HEAD >> artifacts/provenance.txt
          cargo build --locked --manifest-path fusor/Cargo.toml -p fusor --no-default-features --features gpu,kernel-observer --example qmatmul_lab
          cp fusor/target/debug/examples/qmatmul_lab artifacts/qmatmul-quad
          shasum -a 256 artifacts/qmatmul-quad >> artifacts/provenance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: grouped-pair-projection-fixture
          path: artifacts
          retention-days: 7
