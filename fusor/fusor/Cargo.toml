[package]
name = "fusor"
description = "fusor user-facing facade: const-rank tensors, layers, sessions, and optimizers"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
web-time.workspace = true
fusor-ir.workspace = true
fusor-tile.workspace = true
fusor-autograd.workspace = true
fusor-cost.workspace = true
fusor-gguf.workspace = true
fusor-gpu = { workspace = true, optional = true }
fusor-cpu = { workspace = true, optional = true }
smallvec.workspace = true
rustc-hash.workspace = true
half.workspace = true
bytemuck.workspace = true
parking_lot.workspace = true

[features]
# Test-only invariant checks and differential execution of e-class members.
compiler-tests = ["fusor-ir/compiler-tests", "fusor-cost/compiler-tests", "fusor-cpu?/compiler-tests", "fusor-gpu?/compiler-tests"]
default = ["cpu", "gpu"]
# Each backend is its own crate; a facade built without one never links it.
# At least one must be on.
cpu = ["dep:fusor-cpu"]
gpu = ["dep:fusor-gpu"]
kernel-observer = ["gpu", "fusor-gpu/kernel-observer"]

[[example]]
name = "coop_attn_repro"
required-features = ["gpu", "compiler-tests"]

[[example]]
name = "qgemv_bench"
required-features = ["gpu"]

[[example]]
name = "qmatmul_lab"
required-features = ["gpu", "kernel-observer"]

[[example]]
name = "attention_lab"
required-features = ["gpu", "kernel-observer"]

[[example]]
name = "cache_growth_lab"
required-features = ["gpu", "kernel-observer"]

[[example]]
name = "replay_plan_lab"
required-features = ["gpu", "kernel-observer"]

[[example]]
name = "vector_lab"
required-features = ["gpu", "kernel-observer"]

[[example]]
name = "sym_decode_spike"
required-features = ["gpu"]

# Blocking on a GPU future is a native-only convenience: on the web the
# device is driven by the browser's event loop, so everything is awaited.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

[dev-dependencies]
fusor-visualize = { path = "../fusor-visualize" }
serde_json.workspace = true
sha2 = "0.10"
wgpu.workspace = true
naga = { workspace = true, features = ["wgsl-in"] }

[[example]]
name = "affine_copy_lab"
required-features = ["gpu", "kernel-observer"]

[[example]]
name = "indexed_map_lab"
required-features = ["gpu", "kernel-observer"]
