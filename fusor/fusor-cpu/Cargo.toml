[package]
name = "fusor-cpu"
description = "fusor CPU target: Cranelift kernels, platform GEMM, worker pool"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
fusor-ir.workspace = true
fusor-tile.workspace = true
fusor-gguf.workspace = true
smallvec.workspace = true
rustc-hash.workspace = true
half.workspace = true
bytemuck.workspace = true
parking_lot.workspace = true
wasm-encoder = "0.245"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cranelift-codegen = "0.125.3"
cranelift-frontend = "0.125.3"
cranelift-jit = "0.125.3"
cranelift-module = "0.125.3"
cranelift-native = "0.125.3"
wasmi = { version = "2.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[features]
# Instrumentation for the compiler conformance harness only.
compiler-tests = ["fusor-ir/compiler-tests"]
# Run every native kernel through the wasm emitter under `wasmi`, so the
# conformance suite verifies the emitter the browser uses.
wasm-emit = ["dep:wasmi"]
