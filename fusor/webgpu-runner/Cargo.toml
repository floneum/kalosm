[package]
name = "fusor-webgpu-runner"
description = "Browser runner for the fusor conformance suite and benchmarks, on WebGPU"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
dioxus = { version = "0.7", default-features = false, features = ["minimal", "web", "asset", "document"] }
dioxus-icons = { version = "0.1.0", default-features = false }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false, features = ["web"] }
dioxus-router = { version = "0.7", default-features = false, features = ["html"] }
# GPU only: the CPU backend is native-only, and a browser has one device.
fusor = { workspace = true, default-features = false, features = ["gpu"] }
fusor-conformance = { workspace = true, default-features = false, features = ["burn-bench"] }
web-time.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# dioxus-web 0.7.10's history code needs `Location`, which only its
# `devtools` feature turns on; a minimal build has to ask for it itself.
web-sys = { version = "0.3", features = ["Window", "Location", "History"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
